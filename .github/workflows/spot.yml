name: spot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min (GitHub may delay runs a few minutes)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]          # rebuild the site right after a change is pushed

permissions:
  contents: write   # force-push the data branch
  pages: write      # deploy the site
  id-token: write

concurrency:
  group: spot
  cancel-in-progress: false

jobs:
  spot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Restore the previous data (rare sightings log) from the data branch, if it exists.
      - name: Restore data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No data branch yet (first run)."
          fi

      - name: Fetch aircraft
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./scripts/spot.ps1

      # Save data as a single fresh commit on the data branch, so history never piles up.
      - name: Save data (overwrite)
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "spotter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/*.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
