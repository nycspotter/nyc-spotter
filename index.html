<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NYC Spotter Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: airport wayfinding signage. Yellow sign strip, today's rare schedule as the main board, supporting lists below. */
:root {
  --bg: #eceff2;
  --panel: #ffffff;
  --ink: #12161c;
  --muted: #5a6370;
  --line: #d4d9df;
  --sign: #ffc20e;
  --sign-ink: #12161c;
  --mil: #4f6125;  --mil-bg: #e7edd8;
  --xl: #6b3fb8;   --xl-bg: #ece4fa;
  --liv: #b8185f;  --liv-bg: #fbe2ee;
  --watch: #1d64c4; --watch-bg: #e0ecfb;
  --arr: #1d64c4; --dep: #1a7f4b;
  --live: #b34700; --live-bg: #fff0e0; --star: #c98a00;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1115; --panel: #171b21; --ink: #e8ebee; --muted: #97a1ad; --line: #2a3139;
    --mil: #b3c77f;  --mil-bg: #263016;
    --xl: #c2a6f5;   --xl-bg: #2c2140;
    --liv: #f48bbb;  --liv-bg: #3d1a2b;
    --watch: #86b6f6; --watch-bg: #172a45;
    --arr: #86b6f6; --dep: #6fd29d;
    --live: #ffb070; --live-bg: #3a2512; --star: #ffc20e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1115; --panel: #171b21; --ink: #e8ebee; --muted: #97a1ad; --line: #2a3139;
  --mil: #b3c77f;  --mil-bg: #263016;
  --xl: #c2a6f5;   --xl-bg: #2c2140;
  --liv: #f48bbb;  --liv-bg: #3d1a2b;
  --watch: #86b6f6; --watch-bg: #172a45;
  --arr: #86b6f6; --dep: #6fd29d;
  --live: #ffb070; --live-bg: #3a2512; --star: #ffc20e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }

.sign { background: var(--sign); color: var(--sign-ink); padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px; }
.sign-inner, main, footer { max-width: 1180px; margin: 0 auto; }
.sign-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; }
.brand { font: 700 clamp(26px, 4vw, 36px)/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.brand span { font-weight: 500; opacity: .7; }
.sign-right { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.status { font: 500 14px/1.3 var(--body); display: flex; gap: 6px 14px; flex-wrap: wrap; }
.status b { font-family: var(--mono); font-weight: 600; }
.lang { display: inline-flex; border: 1.5px solid var(--sign-ink); border-radius: 999px; overflow: hidden; }
.lang button {
  font: 700 12px/1 var(--body); letter-spacing: .04em; padding: 6px 10px; cursor: pointer;
  border: 0; background: transparent; color: var(--sign-ink);
}
.lang button[aria-pressed="true"] { background: var(--sign-ink); color: var(--sign); }

main { padding: 24px 16px 8px; display: grid; gap: 36px; }
section > h2 {
  font: 700 22px/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase;
  margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; text-wrap: balance;
}
section > h2 small { font: 400 13px/1.3 var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
.notice { background: var(--live-bg); color: var(--live); padding: 10px 14px; border-radius: 6px; font-weight: 500; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); max-width: 70ch; }

.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.tag { font: 700 11px/1 var(--body); letter-spacing: .04em; padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
.tag.military { color: var(--mil); background: var(--mil-bg); }
.tag.xl { color: var(--xl); background: var(--xl-bg); }
.tag.livery { color: var(--liv); background: var(--liv-bg); }
.tag.watch { color: var(--watch); background: var(--watch-bg); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters button {
  font: 500 13px/1 var(--body); padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button .n { font-family: var(--mono); font-size: 11px; opacity: .65; margin-left: 4px; }
.air-bar { display: grid; gap: 8px; }
.air-bar .label { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.air-bar .filters { margin-bottom: 0; }

/* departure-board table */
.table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sub { display: block; color: var(--muted); font-size: 12px; }
td.time { font: 700 24px/1 var(--display); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
td.time .sub { font: 400 11px/1.4 var(--body); letter-spacing: 0; margin-top: 3px; }
tr.past td { opacity: .55; }
.ev { font: 700 11px/1 var(--body); padding: 5px 8px; border-radius: 4px; border: 1px solid currentColor; }
.ev.arr { color: var(--arr); } .ev.dep { color: var(--dep); }
.state { font-weight: 500; }
.state.airborne { color: var(--live); }
.state.done, .state.unseen { color: var(--muted); }
.links { display: flex; gap: 12px; font-size: 13px; }
.links a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.links a:hover { color: var(--ink); }

/* on the ground now */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .type { font: 700 28px/1 var(--display); }
.code { background: var(--sign); color: var(--sign-ink); font: 700 18px/1 var(--display); letter-spacing: .05em; padding: 4px 7px 3px; border-radius: 3px; }
.card .next { font-weight: 500; }

/* date picker */
.date-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.date-bar button, .date-bar input {
  font: 500 14px/1 var(--body); height: 36px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.date-bar button { min-width: 36px; padding: 0 12px; }
.date-bar #d-prev, .date-bar #d-next { font-size: 20px; padding: 0; }
.date-bar button:disabled { opacity: .4; cursor: default; }
.date-bar input { padding: 0 10px; font-family: var(--mono); }
.star { text-decoration: none; color: var(--muted); font-size: 16px; line-height: 1; margin-left: 4px; }
.star:hover { color: var(--star); }
.star.on { color: var(--star); }
.watch-list { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; margin-bottom: 10px; }
.watch-list a { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.watch-list a .star { margin: 0 4px 0 0; }
.star-help { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.plan-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.plan-bar .filters { margin-bottom: 0; }
.plan-bar input {
  flex: 1 1 220px; min-width: 0; height: 36px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 400 14px/1 var(--body);
}
.mode-note { font-size: 13px; color: var(--live); background: var(--live-bg); border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }

/* runways & spots */
.rwy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.rwy { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.rwy header { display: flex; align-items: center; gap: 10px; }
.rwy header .name { font-weight: 700; }
.rwy-flow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rwy-flow > div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; }
.rwy-flow .k { font: 700 11px/1 var(--body); letter-spacing: .06em; color: var(--muted); }
.rwy-flow b { font: 700 26px/1.1 var(--display); letter-spacing: .03em; }
.spots { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.spots li { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 5px; }
.spot-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.spot-top a { color: var(--muted); font-size: 13px; text-underline-offset: 3px; white-space: nowrap; }
.spot-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.rwy-src { margin-top: 8px; }
.rwy-map { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 6px; }
.rwy-map .rl { font: 700 10px/1 var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
.rwy-map .rw { stroke: var(--muted); stroke-opacity: .45; stroke-width: 6; }
.rwy-map .rw.on { stroke: var(--ink); stroke-opacity: 1; }
.rwy-map .ra, .map-legend .lg.ra { stroke: var(--arr); background: var(--arr); }
.rwy-map .rd, .map-legend .lg.rd { stroke: var(--dep); background: var(--dep); }
.rwy-map .ra, .rwy-map .rd { stroke-width: 2.5; }
.rwy-map .ra-head { fill: var(--arr); } .rwy-map .rd-head { fill: var(--dep); }
.rwy-map .pin { fill: var(--sign); stroke: var(--sign-ink); stroke-width: 1.2; }
.rwy-map .pn { font: 700 10px/1 var(--body); fill: var(--sign-ink); text-anchor: middle; dominant-baseline: central; }
.rwy-map .north { fill: var(--muted); }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend .lg { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.map-legend .lg.pin { width: 10px; height: 10px; border-radius: 50%; background: var(--sign); border: 1px solid var(--sign-ink); }
.pin-n {
  display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; margin-right: 6px;
  background: var(--sign); color: var(--sign-ink); font: 700 11px/1 var(--body); vertical-align: 1px;
}

.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* phones: tables become stacked rows with the same columns on every row */
@media (max-width: 640px) {
  body { font-size: 14px; }
  .sign-inner { align-items: flex-start; }
  .brand { font-size: 26px; }
  .status { font-size: 12px; gap: 4px 10px; }
  main { padding-top: 18px; gap: 28px; }
  section > h2 { font-size: 20px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; }
  .table-wrap { overflow: visible; }
  .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; }
  .table-wrap thead { display: none; }
  .table-wrap tr {
    display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .table-wrap tbody tr:last-child { border-bottom: 0; }
  .table-wrap td { padding: 0; border: 0; white-space: normal; min-width: 0; }
  .table-wrap td:empty { display: none; }
  td.c-time { grid-column: 1; grid-row: 1 / span 3; }
  .t-today td.c-time { grid-row: 1 / span 6; }
  td.c-time.mono { font-size: 13px; }
  td.c-cs   { grid-column: 2; grid-row: 1; font-weight: 600; }
  td.c-ev   { grid-column: 3; grid-row: 1; justify-self: end; }
  td.c-air  { grid-column: 2; grid-row: 2; }
  td.c-air .sub { display: inline; margin-left: 4px; }
  td.c-ap   { grid-column: 3; grid-row: 2; justify-self: end; font-weight: 600; }
  td.c-type { grid-column: 2 / span 2; grid-row: 3; }
  td.c-type .sub { display: inline; margin-left: 4px; }
  td.c-reg  { grid-column: 3; grid-row: 2; justify-self: end; }
  .t-today td.c-reg { grid-row: 4; grid-column: 2 / span 2; justify-self: start; color: var(--muted); }
  td.c-days { grid-column: 3; grid-row: 2; justify-self: end; text-align: right; }
  td.c-state { grid-column: 2 / span 2; grid-row: 5; }
  td.c-links { grid-column: 2 / span 2; grid-row: 6; }
  .rwy-flow b { font-size: 22px; }
}

footer { padding: 24px 16px calc(env(safe-area-inset-bottom, 0px) + 32px); color: var(--muted); font-size: 13px; }
footer p { margin: 4px 0; max-width: 75ch; }
</style>
</head>
<body>
<div class="sign">
  <div class="sign-inner">
    <h1 class="brand">NYC Spotter Board <span>EWR · JFK · LGA</span></h1>
    <div class="sign-right">
      <div class="status" id="status"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">한</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="notice" id="notice" hidden></div>

  <div class="air-bar">
    <span class="label" data-t="airportFilterLabel"></span>
    <div class="filters" id="ap-filters" role="group"></div>
    <span class="label" data-t="regionFilterLabel"></span>
    <div class="filters" id="region-filters" role="group"></div>
    <span class="label" data-t="airlineFilterLabel"></span>
    <div class="filters" id="air-filters" role="group"></div>
  </div>

  <section aria-labelledby="h-today">
    <h2 id="h-today"><span data-t="todayTitle"></span> <small id="today-sub"></small></h2>
    <div class="date-bar">
      <button type="button" id="d-prev" data-t-aria="prevDay">‹</button>
      <input type="date" id="d-input">
      <button type="button" id="d-next" data-t-aria="nextDay">›</button>
      <button type="button" id="d-today" data-t="todayBtn" hidden></button>
    </div>
    <div class="filters" id="filters" role="group">
      <button type="button" data-k="all" aria-pressed="true" data-t="all"></button>
      <button type="button" data-k="arr" aria-pressed="false" data-t="arrivals"></button>
      <button type="button" data-k="dep" aria-pressed="false" data-t="departures"></button>
    </div>
    <div class="plan-bar" id="plan-bar" hidden>
      <div class="filters" id="plan-mode" role="group">
        <button type="button" data-p="rare" aria-pressed="true" data-t="planRare"></button>
        <button type="button" data-p="all" aria-pressed="false" data-t="planAll"></button>
      </div>
      <input type="search" id="plan-q" autocomplete="off" data-t-ph="planSearch">
    </div>
    <div class="watch-list" id="watch-list" hidden></div>
    <div id="today"></div>
    <p class="star-help" data-t="starHelp"></p>
  </section>

  <section aria-labelledby="h-rwy">
    <h2 id="h-rwy"><span data-t="rwyTitle"></span> <small data-t="rwySub"></small></h2>
    <div id="runways"></div>
  </section>

  <section aria-labelledby="h-ground">
    <h2 id="h-ground"><span data-t="groundTitle"></span> <small data-t="groundSub"></small></h2>
    <div id="ground"></div>
  </section>

  <div class="two">
    <section aria-labelledby="h-patterns">
      <h2 id="h-patterns"><span data-t="patternsTitle"></span> <small data-t="patternsSub"></small></h2>
      <div id="patterns"></div>
    </section>
    <section aria-labelledby="h-recent">
      <h2 id="h-recent"><span data-t="recentTitle"></span></h2>
      <div id="recent"></div>
    </section>
  </div>
</main>

<footer>
  <p data-t="footer1"></p>
  <p><span data-t="dataLabel"></span> <a href="https://adsb.lol" target="_blank" rel="noopener">adsb.lol</a> (ODbL), <a href="https://adsb.fi" target="_blank" rel="noopener">adsb.fi</a>, <a href="https://www.adsbdb.com" target="_blank" rel="noopener">adsbdb</a>. <span data-t="footer2"></span></p>
  <p><span data-t="scheduleLabel"></span> <a href="https://aerodatabox.com" target="_blank" rel="noopener">AeroDataBox</a>. <span id="usage"></span></p>
</footer>

<script>
const I18N = {
  ko: {
    loading: "불러오는 중…",
    todayTitle: "레어 스케줄", nyTime: "뉴욕 시간",
    todayBtn: "오늘로", prevDay: "이전 날", nextDay: "다음 날",
    futureNote: "학습된 정기편을 바탕으로 한 예상이에요(지금 시점 기록 기준). 실제 운항, 기종 변경, 지연은 반영되지 않아요.",
    planNote: (ago) => `발표된 운항 스케줄 기준이에요(${ago} 갱신). 기종은 예정 기종이라 당일 바뀔 수 있어요.`,
    planRare: "레어만", planAll: "전체 예정편", planSearch: "편명·기종·항공사·등록번호 검색 (예: A346, LH400)",
    scheduled: "예정", fromTo: (ev, o) => o ? (ev === "arr" ? ` · ${o}발` : ` · ${o}행`) : "", revised: (t) => ` · 변경 ${t}`,
    scheduleLabel: "예정 스케줄:", usage: (c, b) => `이번 달 조회 ${c}/${b}회`,
    starHelp: "☆를 누르면 GitHub 화면이 열려요. Submit을 누르면 다음 갱신(최대 10분) 때 ★로 바뀌고 요약·1시간 전 알림 대상이 돼요. ★를 눌러 Close issue 하면 해제돼요.",
    starTitle: { flight: "이 편 관심 등록", type: "이 기종 관심 등록", reg: "이 기체 관심 등록" }, unstar: "관심 해제 (GitHub에서 Close issue)",
    myWatch: "내 관심:", issueBody: "NYC Spotter Board 관심 목록이에요. 이 이슈를 닫으면 관심에서 빠져요.",
    futureEmpty: "이 날 예상되는 레어편이 없어요. 학습된 정기편이 적으면 비어 있을 수 있고, 기록이 쌓일수록 정확해져요.",
    all: "전체", arrivals: "도착", departures: "출발", filterLabel: "도착 출발 필터",
    groundTitle: "지금 공항에 있는 레어", groundSub: "출발 사진 찍을 기회",
    patternsTitle: "자주 오는 레어편", patternsSub: "최근 3주 관측으로 학습",
    recentTitle: "최근 기록",
    footer1: "도착 예정은 비행 중인 기체의 편명 노선과 남은 거리로 계산하고, \"예상\"은 지난 기록에서 같은 편이 보통 오던 시간이에요. 실제와 다를 수 있어요.",

const allShown = () => [...data.today, ...(data.ground || []), ...(data.patterns || []), ...(data.recent || [])].filter(isShown);

function renderRegionFilters() {

  for (const x of allShown()) counts.set(regionOf(x), 0);

  const counts = new Map();
  for (const x of allShown().filter(inRegion)) counts.set(airKey(x), 0);
  for (const s of data.today.filter((s) => isShown(s) && inRegion(s))) counts.set(airKey(s), counts.get(airKey(s)) + 1);
  for (const k of airSel) if (!counts.has(k)) counts.set(k, 0);
  const label = (k) => k === "GOV" ? T().region.gov : airlineName(k);
  const keys = [...counts.keys()].sort((a, b) => label(a).localeCompare(label(b), "en"));   // alphabetical
  $("air-filters").innerHTML =
    `<button type="button" data-air="" aria-pressed="${airSel.size === 0}">${T().allAirlines}</button>` +
    keys.map((k) => `<button type="button" data-air="${esc(k)}" aria-pressed="${airSel.has(k)}">${esc(label(k))}<span class="n">${counts.get(k)}</span></button>`).join("");
}

function stateText(s) {
  if (s.status === "airborne") return `<span class="state airborne">${esc(T().airborne(s.origin))}</span>`;
  if (s.status === "done") return `<span class="state done">${s.ev === "arr" ? T().landed : T().departed}${s.dest ? esc(T().forDest(s.dest)) : ""}</span>`;
  if (s.status === "unseen") return `<span class="state unseen">${T().unseen}</span>`;
  if (s.source === "schedule") {
    const rev = s.rmin != null && s.rmin !== s.min ? T().revised(hm(s.rmin)) : "";
    const other = s.other || (s.ev === "arr" ? s.origin : s.dest);
    return `<span class="state">${T().scheduled}${esc(T().fromTo(s.ev, other))}${rev}</span>`;
  }
  return `<span class="state">${T().expected(s.days)}</span>`;
}

function renderStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T()[el.dataset.t]; });
  $("filters").setAttribute("aria-label", T().filterLabel);
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll("[data-t-aria]").forEach((el) => el.setAttribute("aria-label", T()[el.dataset.tAria]));
  document.querySelectorAll("[data-t-ph]").forEach((el) => { el.placeholder = T()[el.dataset.tPh]; el.setAttribute("aria-label", T()[el.dataset.tPh]); });
  const u = data && data.schedule_usage;
  $("usage").textContent = u && u.budget ? T().usage(u.calls, u.budget) : "";
  if (!data) $("today-sub").textContent = T().nyTime;
}

function renderStatus() {
  if (loadFailed) {
    $("status").textContent = T().noData;
    $("notice").hidden = false;
    $("notice").textContent = T().noDataNotice;
    return;
  }
  if (!data) { $("status").textContent = T().loading; return; }
  const shown = data.today.filter(isShown);
  const air = shown.filter((s) => s.status === "airborne").length;
  $("status").innerHTML = T().statusLine(ago(data.updated), shown.length, air, data.patterns.filter(isShown).length);
  const stale = (Date.now() / 1000 - data.updated) / 60 > 40;
  $("notice").hidden = !stale;
  if (stale) $("notice").textContent = T().stale(ago(data.updated));
}

// ---- date picker: today = live schedule, later days = learned regulars for that weekday ----
const MAX_DAYS_AHEAD = 14;
let viewDate = null;           // "YYYY-MM-DD" in New York time; null means today
const addDays = (d, n) => { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const dowOf = (d) => new Date(d + "T12:00:00Z").getUTCDay();
const curDate = () => viewDate || data.date;

// published schedule (AeroDataBox) for a date, keyed "JFK|2026-10-03" in data.planned
let planMode = "rare", planQ = "";
try { planMode = localStorage.getItem("spot-plan") === "all" ? "all" : "rare"; } catch (e) {}
function plannedFor(d) {
  const out = [];
  let fetched = 0;
  for (const [k, v] of Object.entries(data.planned || {})) {
    const [ap, date] = k.split("|");
    if (date !== d) continue;
    fetched = Math.max(fetched, v.fetched || 0);
    for (const f of v.flights || []) {
      out.push({ ...f, ap, kinds: f.kinds || [], hex: null, status: "expected", source: "schedule",
                 origin: f.ev === "arr" ? f.other : null, dest: f.ev === "dep" ? f.other : null });
    }
  }
  return { flights: out.sort((a, b) => a.min - b.min), fetched };
}
const learnedFor = (d, skipAps) => {
  const dow = dowOf(d);
  return (data.patterns || [])
    .filter((p) => (p.daily || (p.dows || []).includes(dow)) && !skipAps.has(p.ap))
    .map((p) => ({ ...p, hex: null, status: "expected", source: "pattern" }));
};
const matchesQuery = (s) => !planQ || [s.num, s.cs, s.type, s.model, s.airline, s.reg, s.other, s.note]
  .some((v) => v && String(v).toLowerCase().includes(planQ));

function rowsForDate() {
  const d = curDate();
  const { flights, fetched } = plannedFor(d);
  const hasPlan = flights.length > 0;
  if (hasPlan && planMode === "all") {
    // full published schedule; on today, live status (airborne/landed) overrides the plan
    const live = d === data.date ? new Map(data.today.map((s) => [s.ev + "|" + s.ap + "|" + s.cs, s])) : new Map();
    const rows = flights.map((p) => { const l = live.get(p.ev + "|" + p.ap + "|" + p.cs); return l ? { ...p, ...l, model: p.model, num: p.num } : p; });
    return { mode: "plan", hasPlan, fetched, rows: rows.filter(matchesQuery) };
  }
  if (d === data.date) return { mode: "today", hasPlan, fetched, rows: data.today.filter(matchesQuery) };
  if (hasPlan) {
    const rare = flights.filter((p) => p.kinds.length);
    const rows = [...rare, ...learnedFor(d, new Set(flights.map((p) => p.ap)))].sort((a, b) => a.min - b.min);
    return { mode: "plan", hasPlan, fetched, rows: rows.filter(matchesQuery) };
  }
  return { mode: "future", hasPlan, fetched, rows: learnedFor(d, new Set()).sort((a, b) => a.min - b.min).filter(matchesQuery) };
}

function renderDateBar() {
  if (!data) return;
  const d = curDate();
  const inp = $("d-input");
  inp.min = data.date; inp.max = addDays(data.date, MAX_DAYS_AHEAD); inp.value = d;
  $("d-prev").disabled = d <= inp.min;
  $("d-next").disabled = d >= inp.max;
  $("d-today").hidden = d === data.date;
  $("today-sub").textContent = `${d} (${T().dow[dowOf(d)]}) · ${T().nyTime}`;
}

function setViewDate(d) {
  if (!data || !d) return;
  const min = data.date, max = addDays(data.date, MAX_DAYS_AHEAD);
  d = d < min ? min : d > max ? max : d;
  viewDate = d === data.date ? null : d;
  renderDateBar();
  renderToday();
}

function renderToday() {
  document.querySelectorAll("#filters button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === filter)));
  renderDateBar();
  const { mode, rows: all, hasPlan, fetched } = rowsForDate();
  $("plan-bar").hidden = !hasPlan;
  document.querySelectorAll("#plan-mode button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === planMode)));
  const note = mode === "future" ? `<div class="mode-note">${T().futureNote}</div>`
    : mode === "plan" ? `<div class="mode-note">${T().planNote(ago(fetched))}</div>` : "";
  const rows = all.filter((s) => (filter === "all" || s.ev === filter) && passAir(s));
  if (!rows.length) {
    const empty = all.length ? T().noMatch : mode === "future" ? T().futureEmpty : T().todayEmpty;
    $("today").innerHTML = note + `<div class="empty">${empty}</div>`;
    return;
  }
  $("today").innerHTML = note + `<div class="table-wrap"><table class="t-today">
    ${thead(T().thToday)}
    <tbody>${rows.map((s) => {
      const past = (s.status === "done" || s.status === "unseen");
      const when = s.min >= 1440 ? T().tomorrow : s.status === "airborne" ? T().eta
        : s.status === "expected" ? (s.source === "schedule" ? T().scheduled : T().usual) : "";
      return `<tr class="${past ? "past" : ""}">
        <td class="time c-time">${hm(s.min)}<span class="sub">${when}</span></td>
        <td class="c-ev"><span class="ev ${s.ev}">${T().ev[s.ev]}</span></td>
        <td class="mono c-ap">${esc(s.ap)}</td>
        <td class="mono c-cs">${esc(s.cs || "—")}${starBtn("flight", s.num || s.cs)}</td>
        <td class="c-air">${airlineCell(s)}</td>
        <td class="c-type">${typeCell(s)}${s.type ? starBtn("type", s.type) : ""}</td>
        <td class="mono c-reg">${esc(s.reg || "—")}</td>
        <td class="c-state">${stateText(s)}</td>
        <td class="c-links">${links(s)}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

function renderGround() {
  const g = (data.ground || []).filter(passAir);
  if (!g.length) {
    $("ground").innerHTML = `<div class="empty">${T().groundEmpty}</div>`;
    return;
  }
  $("ground").innerHTML = `<div class="cards">${g.map((x) => `
    <article class="card">
      <div class="top"><span class="type">${esc(x.type)}</span><span class="code">${esc(x.ap)}</span></div>
      <div>${tagsHtml(x.kinds)} <span class="mono">${esc(x.reg || "")}</span> ${airlineCode(x.cs) ? esc(airlineName(airlineCode(x.cs))) : ""}</div>
      <div class="sub">${x.since ? T().landedAt(nyTime(x.since)) : T().landedUnknown}${x.cs ? " · " + esc(x.cs) : ""}</div>
      <div class="next">${x.next_dep ? esc(T().nextDep(hm(x.next_dep.min), x.next_dep.cs)) : T().nextDepUnknown}</div>
      ${links(x)}
    </article>`).join("")}</div>`;
}

let spots = null;
const AIRPORT_NAME = { EWR: "Newark Liberty", JFK: "John F. Kennedy", LGA: "LaGuardia" };

// runway thresholds [low end, lat, lon, high end, lat, lon] from OurAirports (ourairports.com, public domain)
const RUNWAY_GEO = {
  EWR: [["04L", 40.675392, -74.179456, "22R", 40.70257, -74.16217],
        ["04R", 40.677588, -74.174253, "22L", 40.702299, -74.158539],
        ["11", 40.702815, -74.180748, "29", 40.701203, -74.156502]],
  JFK: [["04L", 40.622002, -73.785599, "22R", 40.6488, -73.764702],
        ["04R", 40.625401, -73.770302, "22L", 40.645199, -73.754899],
        ["13L", 40.657799, -73.790199, "31R", 40.6437, -73.7593],
        ["13R", 40.648399, -73.816704, "31L", 40.627899, -73.771599]],
  LGA: [["04", 40.769199, -73.884102, "22", 40.7854, -73.870697],
        ["13", 40.782299, -73.878502, "31", 40.772099, -73.857101]]
};

// Schematic airport map: runways to true scale and orientation, the flow in use as arrows, recommended spots as numbered pins.
function runwayMap(code, r, pins) {
  const rwys = RUNWAY_GEO[code];
  if (!rwys) return "";
  const pts = [];
  rwys.forEach((w) => pts.push([w[1], w[2]], [w[4], w[5]]));
  pins.forEach((s) => pts.push([s.lat, s.lon]));
  const lat0 = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const k = Math.cos(lat0 * Math.PI / 180);
  const xy = (lat, lon) => [lon * k, -lat];
  const P = pts.map((p) => xy(p[0], p[1]));
  const minX = Math.min(...P.map((p) => p[0])), maxX = Math.max(...P.map((p) => p[0]));
  const minY = Math.min(...P.map((p) => p[1])), maxY = Math.max(...P.map((p) => p[1]));
  const W = 320, pad = 34;
  const scale = Math.min((W - 2 * pad) / (maxX - minX || 1), (W * 0.75 - 2 * pad) / (maxY - minY || 1));
  const H = Math.round((maxY - minY) * scale + 2 * pad);
  const tx = (lat, lon) => { const [x, y] = xy(lat, lon); return [pad + (x - minX) * scale + ((W - 2 * pad) - (maxX - minX) * scale) / 2, pad + (y - minY) * scale]; };
  const num = (end) => end.replace(/[LRC]$/, "");
  const arrIn = (end) => (r.arr || []).includes(num(end));
  const depIn = (end) => (r.dep || []).includes(num(end));
  let svg = "";
  for (const [a, la, loa, b, lb, lob] of rwys) {
    const [x1, y1] = tx(la, loa), [x2, y2] = tx(lb, lob);
    const len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    const active = arrIn(a) || arrIn(b) || depIn(a) || depIn(b);
    // colors go through CSS classes: Safari ignores var() inside SVG presentation attributes
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="rw${active ? " on" : ""}"/>`;
    // end labels sit just outside each threshold
    svg += `<text x="${x1 - ux * 13}" y="${y1 - uy * 13}" class="rl">${a}</text><text x="${x2 + ux * 13}" y="${y2 + uy * 13}" class="rl">${b}</text>`;
    // landing on an end: arrow comes in from outside toward that threshold; departing: arrow leaves past the far end
    const arrow = (sx, sy, ex, ey, cls) => `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" class="${cls}" marker-end="url(#ah-${cls}-${code})"/>`;
    if (arrIn(a)) svg += arrow(x1 - ux * 46, y1 - uy * 46, x1 - ux * 22, y1 - uy * 22, "ra");
    if (arrIn(b)) svg += arrow(x2 + ux * 46, y2 + uy * 46, x2 + ux * 22, y2 + uy * 22, "ra");
    if (depIn(a)) svg += arrow(x2 + ux * 22, y2 + uy * 22, x2 + ux * 46, y2 + uy * 46, "rd");
    if (depIn(b)) svg += arrow(x1 - ux * 22, y1 - uy * 22, x1 - ux * 46, y1 - uy * 46, "rd");
  }
  pins.forEach((s, i) => {
    const [x, y] = tx(s.lat, s.lon);
    svg += `<circle cx="${x}" cy="${y}" r="8" class="pin"/><text x="${x}" y="${y}" class="pn">${i + 1}</text>`;
  });
  const defs = ["ra", "rd"].map((c) => `<marker id="ah-${c}-${code}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="${c}-head"/></marker>`).join("");
  const north = `<g transform="translate(${W - 16},18)"><path d="M0,-9 L5,5 L0,2 L-5,5 z" class="north"/><text y="16" class="rl">N</text></g>`;
  return `<svg class="rwy-map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${code} runway map"><defs>${defs}</defs>${svg}${north}</svg>
    <div class="map-legend"><span><i class="lg ra"></i>${T().rwyArr}</span><span><i class="lg rd"></i>${T().rwyDep}</span>${pins.length ? `<span><i class="lg pin"></i>${T().spotPin}</span>` : ""}</div>`;
}
function renderRunways() {
  const rw = data.runways || {};
  const codes = Object.keys(rw).filter((c) => apSel.size === 0 || apSel.has(c));
  if (!codes.length) { $("runways").innerHTML = ""; return; }
  const ends = (list) => (list && list.length ? list.map(esc).join(" · ") : T().rwyNone);
  $("runways").innerHTML = `<div class="rwy-grid">${codes.map((code) => {
    const r = rw[code];
    const flows = [...(r.arr || []).map((e) => "arr" + e), ...(r.dep || []).map((e) => "dep" + e)];
    const matches = ((spots && spots[code]) || [])
      .map((s) => ({ s, hit: s.flows.filter((f) => flows.includes(f)) }))
      .filter((m) => m.hit.length)
      .sort((a, b) => a.s.caution - b.s.caution || b.hit.length - a.hit.length)
      .slice(0, 3);
    const basis = r.basis === "traffic" ? T().basisTraffic(r.votes) : r.basis === "wind" ? T().basisWind : T().basisNone;
    return `<article class="rwy">
      <header><span class="code">${code}</span><span class="name">${AIRPORT_NAME[code] || code}</span></header>
      <div class="rwy-flow">
        <div><span class="k">${T().rwyArr}</span><b>${ends(r.arr)}</b></div>
        <div><span class="k">${T().rwyDep}</span><b>${ends(r.dep)}</b></div>
      </div>
      <div class="sub">${esc(T().wind(r.wind_dir, r.wind_spd, r.wind_gust))} · ${basis}</div>
      ${runwayMap(code, r, matches.map((m) => m.s).filter((s) => s.lat != null))}
      ${spots == null ? "" : matches.length ? `<ul class="spots">${matches.map(({ s, hit }, i) => `
        <li>
          <div class="spot-top"><b><span class="pin-n">${i + 1}</span>${esc(s.name)}</b>
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name + ", " + s.area)}" target="_blank" rel="noopener">${T().map}</a></div>
          <div class="spot-tags">${hit.map((f) => `<span class="tag watch">${esc(T().spotFor(f))}</span>`).join("")}${s.caution ? `<span class="tag livery">${T().caution}</span>` : ""}</div>
          <div class="sub">${esc(s.tip)}</div>
        </li>`).join("")}</ul>` : `<div class="sub">${T().noSpot}</div>`}
    </article>`;
  }).join("")}</div><div class="sub rwy-src">${T().spotSource}</div>`;
}

function renderPatterns() {
  const p = (data.patterns || []).filter(passAir);
  if (!p.length) {
    $("patterns").innerHTML = `<div class="empty">${T().patternsEmpty}</div>`;
    return;
  }
  $("patterns").innerHTML = `<div class="table-wrap"><table>
    ${thead(T().thPatterns)}
    <tbody>${p.map((x) => `<tr>
      <td class="mono c-time">${hm(x.min)}<span class="sub">${esc(x.ap)}</span></td>
      <td class="c-ev"><span class="ev ${x.ev}">${T().ev[x.ev]}</span></td>
      <td class="mono c-cs">${esc(x.cs)}</td>
      <td class="c-air">${airlineCell(x)}</td>
      <td class="c-type">${typeCell(x)}</td>
      <td class="c-days">${x.daily ? T().daily : (x.dows || []).map((d) => T().dow[d]).join(T().dowJoin)}<span class="sub">${T().seenDays(x.days)}</span></td>
    </tr>`).join("")}</tbody></table></div>`;
}

function renderRecent() {
  const r = (data.recent || []).filter(passAir);
  if (!r.length) {
    $("recent").innerHTML = `<div class="empty">${T().recentEmpty}</div>`;
    return;
  }
  $("recent").innerHTML = `<div class="table-wrap"><table>
    ${thead(T().thRecent)}
    <tbody>${r.map((e) => `<tr>
      <td class="mono c-time">${nyTime(e.ts)}<span class="sub">${esc(e.ap)}</span></td>
      <td class="c-ev"><span class="ev ${e.ev}">${T().ev[e.ev] || esc(e.ev)}</span></td>
      <td class="mono c-cs">${esc(e.cs || "—")}</td>
      <td class="c-air">${airlineCell(e)}</td>
      <td class="c-type">${typeCell(e)}</td>
      <td class="mono c-reg">${esc(e.reg || "—")}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

function renderAll() {
  renderStatic();
  renderStatus();
  renderApFilters();
  renderRegionFilters();
  renderWatchList();
  renderAirFilters();
  if (data) { renderToday(); renderRunways(); renderGround(); renderPatterns(); renderRecent(); }
}

async function load() {
  if (!spots) {
    try { const s = await fetch("spots.json"); if (s.ok) spots = await s.json(); } catch (e) {}
  }
  try {
    const r = await fetch("data/schedule.json?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    loadFailed = false;
  } catch (e) {
    loadFailed = !data;
  }
  renderAll();
}

$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || !data) return;
  filter = b.dataset.k;
  try { localStorage.setItem("spot-ev", filter); } catch (err) {}
  renderToday();
});

$("ap-filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const k = b.dataset.ap;
  if (!k) apSel.clear();
  else if (apSel.has(k)) apSel.delete(k);
  else apSel.add(k);
  try { localStorage.setItem("spot-airports", JSON.stringify([...apSel])); } catch (err) {}
  renderAll();
});

$("region-filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || !data) return;
  const r = b.dataset.region;
  if (!r) regSel.clear();
  else if (regSel.has(r)) regSel.delete(r);
  else regSel.add(r);
  // drop picked airlines that are outside the chosen regions
  if (regSel.size) {
    const regionOfKey = (k) => k === "GOV" ? "gov" : (REGION_OF[k] || "other");
    for (const k of [...airSel]) if (!regSel.has(regionOfKey(k))) airSel.delete(k);
  }
  try {
    localStorage.setItem("spot-regions", JSON.stringify([...regSel]));
    localStorage.setItem("spot-airlines", JSON.stringify([...airSel]));
  } catch (err) {}
  renderAll();
});

$("air-filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || !data) return;
  const k = b.dataset.air;
  if (!k) airSel.clear();
  else if (airSel.has(k)) airSel.delete(k);
  else airSel.add(k);
  try { localStorage.setItem("spot-airlines", JSON.stringify([...airSel])); } catch (err) {}
  renderAll();
});

$("plan-mode").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  planMode = b.dataset.p;
  try { localStorage.setItem("spot-plan", planMode); } catch (err) {}
  renderToday();
});
$("plan-q").addEventListener("input", (e) => { planQ = e.target.value.trim().toLowerCase(); renderToday(); });

$("d-prev").addEventListener("click", () => data && setViewDate(addDays(curDate(), -1)));
$("d-next").addEventListener("click", () => data && setViewDate(addDays(curDate(), 1)));
$("d-today").addEventListener("click", () => setViewDate(data && data.date));
$("d-input").addEventListener("change", (e) => setViewDate(e.target.value));

document.querySelector(".lang").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("spot-lang", lang); } catch (err) {}
  renderAll();
});

renderAll();
load();
setInterval(load, 60000);
setInterval(renderStatus, 15000);
</script>
